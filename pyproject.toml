[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "localpilot"
version = "0.1.0"
description = "Local-first Windows agent with GitHub-backed self-development scaffolding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6.0",
  "psutil>=6.0.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
localpilot = "localpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["localpilot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
