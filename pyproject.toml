[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "localpilot"
version = "0.2.0"
description = "Local-first Windows agent with isolated, evidence-driven self-development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6.0",
  "Pillow>=10.4,<12",
  "pypdf>=6.16,<7",
  "psutil>=6.0.0",
  "pywin32>=306; sys_platform == 'win32'",
  "pywebview>=6.2.1,<7",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
corpus = [
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "colorama==0.4.6; sys_platform == 'win32'",
  "filelock==3.32.5",
  "fsspec==2026.7.0",
  "huggingface_hub==0.36.2",
  "idna==3.19",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "numpy==2.5.3",
  "packaging==26.3",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "regex==2026.9.3",
  "requests==2.34.2",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "tqdm==4.70.0",
  "transformers==4.56.2",
  "typing-extensions==4.16.0",
  "urllib3==2.7.0",
]

[project.scripts]
localpilot = "localpilot.cli:main"

[tool.hatch.build]
# Source checkouts ignore generated self-contained binaries so autonomous Git
# checks remain clean. Release builds explicitly include the published helper.
artifacts = ["localpilot/_hardware/**"]

[tool.hatch.build.targets.wheel]
packages = ["localpilot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
