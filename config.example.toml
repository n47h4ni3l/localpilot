[agent]
name = "LocalPilot"
data_dir = "localpilot-data"
# Advisory point after which every unique observation requires a transient,
# source-ID-backed information-gain checkpoint. This does not force research to stop.
research_soft_tool_rounds = 12
# Hard safety ceiling for unique operator tool rounds. Exact duplicate read-only
# observations reuse the current-turn cache and do not consume another round.
research_hard_tool_rounds = 24

# Everyday PC requests use this model.
[model]
provider = "ollama"
name = "gpt-oss:20b"
think = "high"
temperature = 0.1
# Explicit API context allocation. Ollama installations can otherwise run a
# much smaller context than the model supports, which is especially harmful
# for repository/GitHub tool loops.
context_tokens = 32768

[resource]
active_priority = "below_normal"
idle_priority = "normal"
background_idle_seconds = 600
max_cpu_percent_for_background = 65.0
max_memory_percent_for_background = 82.0

[safety]
auto_allow_read_only = true
auto_allow_reversible = true
require_confirmation_for_destructive = true

[github]
enabled = true
remote = "origin"
main_branch = "main"
auto_push_candidates = true

[selfdev]
enabled = true
# Used only for research/implementation cycles when installed. Otherwise the
# everyday model and then these ordered fallbacks are considered. A model is
# skipped when loading it would exceed the background memory ceiling.
developer_model = "qwen2.5:32b"
developer_model_fallbacks = ["qwen2.5:14b"]
# Reserve space beyond the model file size for context/KV cache.
model_memory_overhead_gb = 1.0
# Unload after every response so a pause returns RAM/VRAM immediately.
ollama_keep_alive = 0
# This invariant cannot be enabled. Validated candidates still require a PR merge.
auto_promote = false
research_tool_rounds = 6
max_tool_rounds = 14
# Static-check failures are fed back into the same candidate, with both a
# per-repair tool limit and a durable total-attempt limit.
local_repair_tool_rounds = 6
max_local_repair_attempts = 3
# Complexity is reported after 100 files; only the bounded hard ceiling blocks.
# Directories do not count as files.
candidate_file_soft_budget = 100
candidate_file_hard_ceiling = 500
max_zip_members = 2000
max_zip_size_mb = 1024
# Candidate downloads are stored under localpilot-data/candidate-resources,
# never in the repository root. They remain inert and provenance-tracked.
candidate_resource_quota_gb = 8.0
max_resource_file_mb = 512
run_static_checks = true
allow_local_candidate_execution = false
learning_database = "learning.sqlite3"
lesson_limit = 6
